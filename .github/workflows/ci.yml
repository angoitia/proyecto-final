name: MLOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-and-tests:
    name: Pipeline, MLflow and API tests
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      MLFLOW_EXPERIMENT: diabetes-progression-ci
      MODEL_NAME: diabetes-progression-model
      CHAMPION_ALIAS: champion
      RMSE_THRESHOLD: "60.0"
      RUN_INTEGRATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MLOps pipeline
        run: python -m mlops.pipeline

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Upload MLflow reports and database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-artifacts
          path: |
            artifacts/reports/
            mlflow.db
            mlruns/
          if-no-files-found: ignore
          retention-days: 7
